# tmux colors — auto-generated by wallust, do not edit manually

set -g mode-style "fg=#2B2826,bg=#BF9F63"

set -g message-style "fg=#FFF7CD,bg=#4B4847"
set -g message-command-style "fg=#FFF7CD,bg=#4B4847"

set -g pane-border-style "fg=#4B4847"
set -g pane-active-border-style "fg=#CCB282"

set -g status-style "fg=#FFF7CD,bg=#2B2826"

set -g status-left "#[fg=#2B2826,bg=#BF9F63,bold] #S #[fg=#BF9F63,bg=#2B2826,nobold,nounderscore,noitalics]"
set -g status-right "#[fg=#2B2826,bg=#2B2826,nobold,nounderscore,noitalics]#[fg=#FFF7CD,bg=#2B2826] #{prefix_highlight} #[fg=#4B4847,bg=#2B2826,nobold,nounderscore,noitalics]#[fg=#FFF7CD,bg=#4B4847] %Y-%m-%d  %I:%M %p #[fg=#BF9F63,bg=#4B4847,nobold,nounderscore,noitalics]#[fg=#2B2826,bg=#BF9F63,bold] #h "
if-shell '[ "$(tmux show-option -gqv "clock-mode-style")" == "24" ]' {
  set -g status-right "#[fg=#2B2826,bg=#2B2826,nobold,nounderscore,noitalics]#[fg=#FFF7CD,bg=#2B2826] #{prefix_highlight} #[fg=#4B4847,bg=#2B2826,nobold,nounderscore,noitalics]#[fg=#FFF7CD,bg=#4B4847] %Y-%m-%d  %H:%M #[fg=#BF9F63,bg=#4B4847,nobold,nounderscore,noitalics]#[fg=#2B2826,bg=#BF9F63,bold] #h "
}

setw -g window-status-activity-style "underscore,fg=#F6EBB0,bg=#2B2826"
setw -g window-status-separator ""
setw -g window-status-style "NONE,fg=#ACA57B,bg=#2B2826"
setw -g window-status-format "#[fg=#2B2826,bg=#2B2826,nobold,nounderscore,noitalics]#[default] #I  #W #F #[fg=#2B2826,bg=#2B2826,nobold,nounderscore,noitalics]"
setw -g window-status-current-format "#[fg=#2B2826,bg=#BF9F63,nobold,nounderscore,noitalics]#[fg=#2B2826,bg=#BF9F63,bold] #I  #W #F #[fg=#BF9F63,bg=#2B2826,nobold,nounderscore,noitalics]"
